<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ambiances – mixez pluie, vent, vagues, orage et feu</title>
  <meta name="description" content="Un mixeur de sons d'ambiance : réglez la pluie, le vent, les vagues, l'orage et le feu, et regardez le paysage changer avec votre mélange.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="page">
    <header class="top">
      <p class="brand">Ambiances</p>
      <label class="timer">
        <span>Minuteur</span>
        <select id="timer" aria-label="Minuteur d'arrêt">
          <option value="0">Aucun</option>
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60">1 heure</option>
          <option value="120">2 heures</option>
        </select>
      </label>
    </header>

    <main class="hero">
      <h1 id="mood">Silence</h1>
      <p id="mood-text" class="mood-text">Montez un curseur pour commencer.</p>
      <p id="timer-info" class="timer-info" hidden></p>
      <p id="audio-error" class="audio-error" role="alert" hidden>Votre navigateur ne peut pas jouer de son ici. Essayez avec un navigateur récent.</p>
    </main>

    <section class="panel" aria-label="Mixeur d'ambiances">
      <div class="bar">
        <button id="play" class="play" type="button" aria-pressed="false">
          <svg class="i-play" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5Z"/></svg>
          <svg class="i-pause" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
          <span id="play-label">Écouter</span>
        </button>

        <div class="presets" role="group" aria-label="Ambiances prêtes à l'emploi">
          <button class="preset" type="button" data-preset="storm">Nuit d'orage</button>
          <button class="preset" type="button" data-preset="beach">Plage calme</button>
          <button class="preset" type="button" data-preset="cabin">Cabane d'hiver</button>
          <button class="preset" type="button" data-preset="forest">Après la pluie</button>
          <button class="preset" type="button" data-preset="silence">Silence</button>
        </div>

        <div class="master">
          <label for="ch-master">Volume</label>
          <input id="ch-master" type="range" min="0" max="100" step="1" value="70">
        </div>
      </div>

      <div class="channels">
        <div class="channel" style="--c:#7FC4D6">
          <label for="ch-rain">Pluie</label>
          <output id="out-rain" for="ch-rain">0 %</output>
          <input id="ch-rain" type="range" min="0" max="100" step="1" value="0">
        </div>
        <div class="channel" style="--c:#C4D3DA">
          <label for="ch-wind">Vent</label>
          <output id="out-wind" for="ch-wind">0 %</output>
          <input id="ch-wind" type="range" min="0" max="100" step="1" value="0">
        </div>
        <div class="channel" style="--c:#4FB0C4">
          <label for="ch-waves">Vagues</label>
          <output id="out-waves" for="ch-waves">0 %</output>
          <input id="ch-waves" type="range" min="0" max="100" step="1" value="0">
        </div>
        <div class="channel" style="--c:#B4A6F0">
          <label for="ch-storm">Orage</label>
          <output id="out-storm" for="ch-storm">0 %</output>
          <input id="ch-storm" type="range" min="0" max="100" step="1" value="0">
        </div>
        <div class="channel" style="--c:#F4B860">
          <label for="ch-fire">Feu</label>
          <output id="out-fire" for="ch-fire">0 %</output>
          <input id="ch-fire" type="range" min="0" max="100" step="1" value="0">
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
